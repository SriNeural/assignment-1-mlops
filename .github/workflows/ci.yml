name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint test train
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest -q

      - name: Retrain and package
        run: python -m cardiascreen.train --skip-download

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-report
          path: |
            models/heart_risk_model.joblib
            reports/metrics.json
            reports/leaderboard.csv
            reports/figures/

  container:
    name: image smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build the serving image
        run: docker build -t cardiascreen:ci .

      - name: Boot and score a sample
        run: |
          docker run -d --name cardiascreen -p 8000:8000 cardiascreen:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = "1"
          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            --data @deploy/sample_request.json
          echo
          docker logs cardiascreen
