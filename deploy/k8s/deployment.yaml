apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardiascreen-api
  namespace: cardiascreen
  labels:
    app: cardiascreen-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cardiascreen-api
  template:
    metadata:
      labels:
        app: cardiascreen-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: cardiascreen-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CARDIA_MODEL_PATH
              value: /app/models/heart_risk_model.joblib
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
